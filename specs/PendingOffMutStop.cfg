\* Stop does not set the flag, and the run did not arm it.
\* Stop is the backstop for a clear flag. This run must fail InvCover.
\* With the run flag held, omitting the stop assignment does not break InvCover.
SPECIFICATION Spec
CONSTANTS
  StopSetsPending = FALSE
  DropSetsPending = TRUE
  AckClearsWhileProg = FALSE
  ArmBeforeProg = FALSE
  ReportClears = TRUE
  ReportAnyTime = FALSE
INVARIANT InvCover
